<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCF Valuator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen">
  <header class="flex flex-col items-center pt-16 px-4">
    <h1 class="text-4xl font-bold text-gray-100 tracking-tight">
      Welcome to DCF Valuator
    </h1>

    <form (ngSubmit)="onSearch(ticker.value)" class="mt-8 w-full max-w-md flex gap-2" role="search">
     
      <input
        #ticker
        placeholder="enter stock e.g. MSFT for Microsoft"
        class="flex-1 rounded-md border border-gray-700 bg-gray-800 px-4 py-2 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      />
      <button
        type="submit"
        class="rounded-md bg-blue-600 px-5 py-2 font-medium text-white hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors"
        
      >
        Search
      </button>
    </form>
    <span>{{dcf_result}}</span>
  </header>
</body>
</html>

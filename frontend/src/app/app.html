<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCF Valuator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="max-w-3xl mx-auto pt-24 px-6">
    <h1 class="font-serif text-6xl font-bold text-slate-800 tracking-tight leading-tight">
      DCF Valuator
    </h1>

    <p class="mt-6 text-slate-500 text-lg max-w-xl">
      Enter a stock ticker and get a valuation
    </p>

    <form
      (ngSubmit)="onSearch(ticker.value)"
      class="mt-12 flex items-end gap-4"
      role="search"
    >
      <div class="flex-1 flex flex-col">
        <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">
          Stock Ticker
        </label>
        <input
          #ticker
          placeholder="e.g. MSFT, AAPL, TSLA, NVDA"
          class="mt-2 w-full bg-transparent border-0 border-b-2 border-slate-300 px-0 py-2 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-blue-600 transition-colors"
        />
      </div>

      <button
        type="submit"
        class="shrink-0 rounded-md bg-blue-700 px-6 py-3 text-sm font-bold tracking-wide text-slate-100 uppercase hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-slate-100 transition-colors"
      >
        Search →
      </button>
    </form>
  </header>
</body>
</html>

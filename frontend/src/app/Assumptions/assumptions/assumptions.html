<div class="space-y-8">
<h2 class="font-serif text-2xl text-slate-500 tracking-tight leading-tight">
  Assumptions
</h2>
  <!-- Forecast Years -->
  <div class="flex flex-col max-w-[160px]">
    <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">
      Forecast Years
    </label>
    <input
      type="number"
      min="1"
      [(ngModel)]="forecastYears"
      name="forecastYears"
      (ngModelChange)="onForecastYearsChange()"
      class="mt-1 bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600"
    />
  </div>

  <!-- Revenue Growth cells -->
  <div>
    @if(yearIndices.length>0){

      <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">
        Revenue Growth by Year
      </label>
      
      <div class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
        @for (year of yearIndices; track year) {
          <div class="flex flex-col">
            <span class="text-xs text-slate-400">Year {{ year + 1 }}</span>
            <input
              type="number"
              step="0.01"
              min="0"
              [(ngModel)]="revenue_growth[year]"
              [name]="'growth-' + year"
              class="mt-1 w-full bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600"
            />
          </div>
        }
        
      </div>
    }
  
  </div>

  <!-- Other four scalar assumptions -->
  <div class="grid grid-cols-2 gap-x-8 gap-y-4">
    <div class="flex flex-col">
      <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">Risk-Free Rate</label>
      <input type="number" step="0.001" [(ngModel)]="risk_free_rate" name="riskFreeRate"
        class="mt-1 bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600" />
    </div>
    <div class="flex flex-col">
      <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">Equity Risk Premium</label>
      <input type="number" step="0.001" [(ngModel)]="equity_risk_premium" name="equityRiskPremium"
        class="mt-1 bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600" />
    </div>
    <div class="flex flex-col">
      <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">Terminal Growth Rate</label>
      <input type="number" step="0.001" [(ngModel)]="terminal_growth_rate" name="terminalGrowthRate"
        class="mt-1 bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600" />
    </div>
    <div class="flex flex-col">
      <label class="text-xs font-semibold tracking-widest text-slate-400 uppercase">Cost of Debt</label>
      <input type="number" step="0.001" [(ngModel)]="cost_of_debt" name="costOfDebt"
        class="mt-1 bg-transparent border-0 border-b-2 border-slate-300 px-0 py-1 text-slate-700 focus:outline-none focus:border-blue-600" />
    </div>
  </div>

</div>
